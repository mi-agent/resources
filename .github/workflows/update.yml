name: update-free-resources
on:
  schedule: [{cron: "30 3 * * *"}]   # 每天 UTC 03:30，晚于上游刷新
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install openpyxl
      - run: python build.py
      - name: Commit
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily update"
          git push
